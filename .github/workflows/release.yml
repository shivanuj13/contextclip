name: Release

on:
  push:
    branches: [main]
    paths:
      - pubspec.yaml
  workflow_dispatch:
    inputs:
      force:
        description: Release even if pubspec version did not change
        type: boolean
        default: false

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect version bump
        id: bump
        env:
          FORCE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: python3 scripts/ci/version_bump.py

      - name: Skip when version is unchanged
        if: steps.bump.outputs.should_release != 'true'
        run: echo "${{ steps.bump.outputs.reason }}"

      - name: Read Flutter version
        if: steps.bump.outputs.should_release == 'true'
        id: fvm
        run: |
          echo "version=$(python3 -c "import json; print(json.load(open('.fvmrc'))['flutter'])")" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        if: steps.bump.outputs.should_release == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true

      - name: Analyze and test
        if: steps.bump.outputs.should_release == 'true'
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build macOS Release
        if: steps.bump.outputs.should_release == 'true'
        run: flutter build macos --release

      - name: Package zip
        if: steps.bump.outputs.should_release == 'true'
        id: pkg
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          APP="build/macos/Build/Products/Release/ContextClip.app"
          ZIP="ContextClip-${VERSION}-macos.zip"
          ditto -c -k --keepParent "$APP" "$ZIP"
          SHA="$(shasum -a 256 "$ZIP" | awk '{print $1}')"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP sha256=$SHA"

      - name: Publish GitHub Release
        if: steps.bump.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.bump.outputs.tag }}" \
            "${{ steps.pkg.outputs.zip }}" \
            --title "ContextClip ${{ steps.bump.outputs.version }}" \
            --generate-notes

      - name: Update cask in this repo
        if: steps.bump.outputs.should_release == 'true'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          SHA: ${{ steps.pkg.outputs.sha256 }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          path = Path("Casks/contextclip.rb")
          text = path.read_text()
          text = re.sub(r'^(\s*version )".*"', rf'\1"{os.environ["VERSION"]}"', text, count=1, flags=re.M)
          text = re.sub(r'^(\s*sha256 )".*"', rf'\1"{os.environ["SHA"]}"', text, count=1, flags=re.M)
          path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/contextclip.rb
          if git diff --cached --quiet; then
            echo "cask already current"
          else
            git commit -m "chore: Homebrew cask ${TAG}"
            git push
          fi

      - name: Update Homebrew tap
        if: steps.bump.outputs.should_release == 'true'
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
          SHA: ${{ steps.pkg.outputs.sha256 }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN is not set — GitHub Release is published, tap was skipped."
            echo "Add a PAT with write access to shivanuj13/homebrew-tap as that secret."
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/shivanuj13/homebrew-tap.git" tap-repo
          cp Casks/contextclip.rb tap-repo/Casks/contextclip.rb
          cd tap-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/contextclip.rb
          if git diff --cached --quiet; then
            echo "tap cask already current"
          else
            git commit -m "contextclip ${TAG}"
            git push
          fi
